name: sra_runinfo_to_ftp
description: Parse SRA runinfo TSV files to extract and organize FTP download links and MD5 checksums
keywords:
  - sra
  - ena
  - ftp
  - runinfo
  - metadata
tools:
  - nextflow:
      description: Native Nextflow process (no external tools)
      homepage: https://www.nextflow.io/
      documentation: https://www.nextflow.io/docs/latest/
      licence:
        - "Apache-2.0"
input:
  - runinfo_file:
      type: file
      description: >
        TSV runinfo file from SRA_IDS_TO_RUNINFO
      pattern: "*.tsv"
output:
  tsv:
    - "*.runinfo_ftp.tsv":
        type: file
        description: TSV with FTP download links and MD5 checksums for FASTQ files
        pattern: "*.tsv"
authors:
  - "@drpatelh"
maintainers:
  - "@ewels"
  - "@taume"
  - "@maxulysse"
