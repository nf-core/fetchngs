name: aspera_cli
description: Download FASTQ files from SRA/ENA via IBM Aspera CLI (fasp protocol)
keywords:
  - fastq
  - download
  - aspera
  - sra
  - ena
tools:
  - aspera_cli:
      description: IBM Aspera Connect SDK for high-speed file transfer
      homepage: https://www.ibm.com/products/aspera
      documentation: https://github.com/IBM/aspera-cli
      licence:
        - "Apache-2.0"
input:
  - - meta:
        type: map
        description: >
          Groovy Map containing sample information e.g. [ id:'test', single_end:false ]
    - fastq:
        type: string
        description: >
          Aspera fasp download URL(s) for FASTQ file(s)
  - user:
      type: string
      description: >
        Aspera user string (e.g. 'era-fasp')
output:
  fastq:
    - - meta:
          type: map
          description: >
            Groovy Map containing sample information
      - "*fastq.gz":
          type: file
          description: Downloaded FASTQ file(s)
          pattern: "*fastq.gz"
  md5:
    - - meta:
          type: map
          description: >
            Groovy Map containing sample information
      - "*md5":
          type: file
          description: MD5 checksum files
          pattern: "*md5"
  versions_aspera_cli:
    - - ${task.process}:
          type: string
          description: The name of the process
      - aspera_cli:
          type: string
          description: The name of the tool
      - gem list aspera-cli | grep -o "[0-9][0-9.]*":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - aspera_cli:
          type: string
          description: The name of the tool
      - gem list aspera-cli | grep -o "[0-9][0-9.]*":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@ewels"
maintainers:
  - "@ewels"
  - "@maxulysse"
