# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "pridepy_streamfilesmetadata"
description: Fetch the file listing (names, categories, sizes, checksums, download links) of a PRIDE Archive project.
keywords:
  - pride
  - proteomics
  - metadata
  - mass spectrometry
tools:
  - "pridepy":
      description: |
        Python client library to access PRIDE Archive data programmatically,
        including downloading files and metadata for public proteomics datasets.
      homepage: "https://github.com/PRIDE-Archive/pridepy"
      documentation: "https://github.com/PRIDE-Archive/pridepy/blob/master/docs/usage.md"
      tool_dev_url: "https://github.com/PRIDE-Archive/pridepy"
      licence: ["Apache-2.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'PXD000001' ]`
    - pride_id:
        type: string
        description: PRIDE Archive project accession (e.g. PXD000001)

output:
  json:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'PXD000001' ]`
      - "${prefix}.files.json":
          type: file
          description: JSON list with one entry per file of the PRIDE project
          pattern: "*.files.json"
  versions_pridepy:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pridepy:
          type: string
          description: The tool name
      - 'python -c "from importlib.metadata import version; print(version(''pridepy''))"':
          type: string
          description: The command used to generate the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pridepy:
          type: string
          description: The tool name
      - 'python -c "from importlib.metadata import version; print(version(''pridepy''))"':
          type: string
          description: The command used to generate the version of the tool

authors:
  - "@Tabea01"
maintainers:
  - "@Tabea01"
