name: samplesheet_write
description: Write the samplesheet and id mappings CSV files for the rows of one data type
keywords:
  - samplesheet
  - CSV
  - metadata
input:
  - - meta:
        type: map
        description: >
          Groovy Map containing the data type, e.g. [ id:'ngs' ]
    - rows:
        type: list
        description: >
          Ordered Groovy Maps, one per run, starting with sample, fastq_1 and fastq_2
  - mapping_fields:
      type: string
      description: >
        Comma-separated list of fields for id_mappings.csv
output:
  samplesheet:
    - - meta:
          type: map
          description: >
            Groovy Map containing the data type, e.g. [ id:'ngs' ]
      - samplesheet.csv:
          type: file
          description: Samplesheet CSV file with metadata for pipeline input
          pattern: "samplesheet.csv"
  mappings:
    - - meta:
          type: map
          description: >
            Groovy Map containing the data type, e.g. [ id:'ngs' ]
      - id_mappings.csv:
          type: file
          description: ID mappings CSV file with the selected fields
          pattern: "id_mappings.csv"
authors:
  - "@maxulysse"
  - "@Tabea01"
