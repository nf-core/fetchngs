# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: ngs_samplesheet
description: Write the samplesheet and id mappings CSV files for SRA / ENA / DDBJ / GEO ids
keywords:
  - samplesheet
  - CSV
  - metadata
components:
  - write/file
input:
  - ch_metadata:
      type: map
      description: >
        Groovy Map containing the metadata of each run from FETCH_NGS e.g. [ id:'SRX6725035_SRR9984183', single_end:false ]

  - pipeline:
      type: string
      description: >
        Name of nf-core pipeline the samplesheet is for e.g. 'rnaseq'

  - strandedness:
      type: string
      description: >
        Strandedness value for the rnaseq pipeline

  - mapping_fields:
      type: string
      description: >
        Comma-separated list of fields for id_mappings.csv

output:
  - samplesheet:
      type: file
      description: >
        Channel with [ meta, samplesheet.csv ], where meta.id is 'ngs'
      pattern: "samplesheet.csv"

  - mappings:
      type: file
      description: >
        Channel with [ meta, id_mappings.csv ], where meta.id is 'ngs'
      pattern: "id_mappings.csv"

authors:
  - "@maxulysse"
  - "@Tabea01"
