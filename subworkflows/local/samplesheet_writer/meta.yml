# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: samplesheet_writer
description: Write the samplesheet and id mappings CSV files per data type
keywords:
  - samplesheet
  - CSV
  - metadata
components:
  - samplesheet/write
input:
  - ch_rows:
      type: list
      description: >
        [ data_type, row ] for each run, where row is an ordered Groovy Map starting with sample, fastq_1 and fastq_2

  - mapping_fields:
      type: string
      description: >
        Comma-separated list of fields for id_mappings.csv

output:
  - samplesheet:
      type: file
      description: >
        Channel with [ meta, samplesheet.csv ] per data type, where meta.id is the data type
      pattern: "samplesheet.csv"

  - mappings:
      type: file
      description: >
        Channel with [ meta, id_mappings.csv ] per data type, where meta.id is the data type
      pattern: "id_mappings.csv"

authors:
  - "@maxulysse"
  - "@Tabea01"
